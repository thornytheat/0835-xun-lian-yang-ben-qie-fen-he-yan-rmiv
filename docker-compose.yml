services:
  app:
    build: .
    ports: ["127.0.0.1:${PORT:-18334}:8000"]
    environment:
      WORKBENCH_DB: /data/workbench.sqlite3
    volumes:
      - history:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 12
volumes:
  history:
